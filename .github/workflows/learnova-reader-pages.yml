name: Learnova Reader — Free GitHub Pages
on:
  push:
    branches: [learnova-reader-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: learnova-reader-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify only static Reader files are published
        run: |
          test -s index.html
          test -s reader.js
          test -f .nojekyll
          test ! -f topics.json
          if find . -path './.git' -prune -o -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.pem' -o -name '*learner*' \) -print | grep .; then
            echo 'Unexpected sensitive file in Pages branch'; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
